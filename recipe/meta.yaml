{% set name = "gwpopulation" %}
{% set version = "1.4.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/gwpopulation-{{ version }}.tar.gz
  sha256: 2e8d32e60d303f2f7dcfc1e44a970eb8a7c3990013c512a02d8c8eab22bff850

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools-scm
    - wheel
  run:
    - wcosmo >=0.3.0
    - bilby >=2.7.0
    - numpy
    - python >={{ python_min }}
    - scipy
    - cached_interpolate >=0.3.0

test:
  requires:
    - python {{ python_min }}
    - astropy-base
    - pip
    - pytest
    - jax
    - numpyro
    - scipy
  source_files:
    - priors/
    - test/
  commands:
    # check metadata
    - python -m pip check
    - python -m pip show gwpopulation
    # run test suite
    - python -m pytest -ra test/

about:
  home: https://github.com/ColmTalbot/gwpopulation
  summary: Unified population inference
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ColmTalbot
